# Verifies that every commit in a pull request carries a Signed-off-by line
# (the Developer Certificate of Origin — see CONTRIBUTING.md and DCO).
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit must be signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>$"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") — no Signed-off-by line"
              missing=1
            elif ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::warning::$(git show -s --format='%h %s' "$sha") — sign-off does not match the author ($author)"
            fi
          done < <(git rev-list "$BASE".."$HEAD")

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Add the missing sign-off with:  git commit --amend -s --no-edit"
            echo "For a whole branch:             git rebase --signoff ${{ github.event.pull_request.base.ref }}"
            echo "See CONTRIBUTING.md for why this is required."
            exit 1
          fi
          echo "All commits signed off."
