# Global nginx configuration for BlockingBear. The `server` block lives in
# templates/default.conf.template and is rendered into conf.d by the image
# entrypoint. This file contains only settings shared by every server.

user  nginx;
# auto uses one worker per CPU available to the container and respects Docker CPU limits.
worker_processes auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Hide version details from error pages and the Server header.
    server_tokens off;

    # The backend enforces the administrator-configured upload limit and returns
    # a translatable application error. An nginx limit would preempt it with an
    # HTML 413, so leave the decision to the backend.
    client_max_body_size 0;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml font/woff font/woff2;

    # --- Login rate limit -----------------------------------------------------
    # The application has no lockout on /api/auth/login. Enforce ten requests
    # per minute per address with a burst of five at the proxy. Disable it by
    # commenting out `limit_req` in the server template, not this shared zone.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}
